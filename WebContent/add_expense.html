<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpendWise - Add Expense</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <h2 onclick="toggleDarkMode()">SpendWise</h2>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html" class="active">Add Expense</a>
            <a href="history.html">History</a>
            <a href="analytics.html">Analytics</a>
            <br><hr><br>
            <a href="#" onclick="exportData('csv')">Export CSV</a>
            <a href="#" onclick="exportData('txt')">Export TXT</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
        
        <div class="main-content">
            <h1>Add Expense</h1>
            <div class="stat-card" style="max-width: 500px; margin: 0 auto; border-left: none;">
                <form onsubmit="handleAddExpense(event)">
                    <div><label>Amount (₹)</label><input type="number" id="exp-amt" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;" required></div>
                    
                    <div><label>Category</label>
                        <select id="exp-cat" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;" required>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div><label>Date</label><input type="date" id="exp-date" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;" required></div>
                    
                    <div><label>Payment Mode</label>
                        <select id="exp-mode" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;">
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>

                    <div><label>Description</label><input type="text" id="exp-desc" style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;"></div>
                    
                    <button type="submit" class="btn">Save Expense</button>
                    <p id="add-msg" style="text-align:center; margin-top: 10px;"></p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
