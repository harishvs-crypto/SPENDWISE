<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpendWise - Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="loadAnalytics()">
    <div class="app-container">
        <div class="sidebar">
            <h2 onclick="toggleDarkMode()">SpendWise</h2>
            <a href="dashboard.html">Dashboard</a>
            <a href="add_expense.html">Add Expense</a>
            <a href="history.html">History</a>
            <a href="analytics.html" class="active">Analytics</a>
            <br><hr><br>
            <a href="#" onclick="exportData('csv')">Export CSV</a>
            <a href="#" onclick="exportData('txt')">Export TXT</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
        
        <div class="main-content">
            <h1>Analytics</h1>
            
            <div class="cards-grid">
                <div class="stat-card">
                    <h3>Highest Expense</h3>
                    <h2 id="high-exp">₹0</h2>
                </div>
                <div class="stat-card success">
                    <h3>Lowest Expense</h3>
                    <h2 id="low-exp">₹0</h2>
                </div>
                <div class="stat-card danger">
                    <h3>Avg Daily Expense</h3>
                    <h2 id="avg-exp">₹0</h2>
                </div>
            </div>

            <div class="stat-card" style="margin-bottom: 20px;">
                <h3>Category-wise Spending</h3>
                <div id="category-bars" style="margin-top: 15px;"></div>
            </div>
            
            <div class="stat-card">
                <h3>Monthly Spending Summary</h3>
                <p style="color: var(--text-muted); margin-bottom: 15px;">Get a detailed summary report of all your transactions aggregated over months.</p>
                <button onclick="exportData('csv')" class="btn" style="width: auto; padding: 10px 20px;">Download Category Report (CSV)</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
