<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1>SpendWise</h1>
        <p>Smart Expense Tracker</p>

        <div id="login-form">
            <h2>Login</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="login-user" placeholder="Username" required>
                <input type="password" id="login-pass" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="toggleAuth()">Register</a></p>
        </div>

        <div id="register-form" style="display: none;">
            <h2>Register</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="reg-user" placeholder="Username" required>
                <input type="password" id="reg-pass" placeholder="Password" required>
                <input type="number" id="reg-budget" placeholder="Monthly Budget (₹)" required>
                <button type="submit" class="btn">Register</button>
            </form>
            <p>Already have an account? <a href="#" onclick="toggleAuth()">Login</a></p>
        </div>
        <p id="auth-msg"></p>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
